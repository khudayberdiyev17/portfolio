# Portfolio nginx config (runs inside Docker, port 80 -> exposed as APP_PORT, default 4000)
server {
    listen 80;
    server_name _;
    server_tokens off;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Backend API ──────────────────────────────────
    location /portfolio/v1/api/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        client_max_body_size 6M;
    }

    # ── Media (uploaded files) ────────────────────────
    location /media/ {
        proxy_pass       http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ── Admin Panel (React SPA) ───────────────────────
    location /khudayberdiyev_admin {
        alias   /usr/share/nginx/html/admin;
        try_files $uri $uri/ /khudayberdiyev_admin/index.html;
        # Cache busting: html no-cache, assets long-cache
        location ~* \.html$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    # ── Frontend Portfolio (React SPA) ────────────────
    location / {
        root    /usr/share/nginx/html/portfolio;
        try_files $uri $uri/ /index.html;
        location ~* \.html$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    # Block sensitive paths
    location ~ /\.(env|git|htaccess) { deny all; return 404; }
    location ~ /(requirements\.txt|alembic\.ini|seed\.py) { deny all; return 404; }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 256;
}
