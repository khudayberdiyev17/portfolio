# ══════════════════════════════════════════════════════════════
#  Portfolio — docker compose up -d
#  CTFd bilan birgalikda ishlaydi (8080 port)
# ══════════════════════════════════════════════════════════════
version: "3.9"

services:

  # ── FastAPI Backend ────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: portfolio-backend
    restart: unless-stopped
    environment:
      APP_ENV: production
      DATABASE_URL: sqlite+aiosqlite:////data/db/portfolio.db
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      # CORS: nginx'dan kelayotgan so'rovlarga ruxsat
      CORS_ORIGINS: "http://localhost,http://localhost:8080,http://80.225.243.175,http://80.225.243.175:8080"
      UPLOAD_DIR: app/static/media
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-5}
    volumes:
      # SQLite DB va uploads — persistent (container o'chsa ham saqlanadi)
      - portfolio_data:/data
    networks:
      - portfolio_net
    # Backend tashqariga chiqmaydi — faqat nginx orqali
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── nginx: Frontend + Admin + Reverse Proxy ────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        # Relative URL — har qanday serverda ishlaydi
        VITE_API_URL: /portfolio/v1/api
    container_name: portfolio-web
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - portfolio_net

# ── Persistent volume (SQLite + uploads) ──────────────────────
volumes:
  portfolio_data:
    name: portfolio_data

# ── Internal network ──────────────────────────────────────────
networks:
  portfolio_net:
    name: portfolio_net
